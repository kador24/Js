name: jamal_phone_manager
description: تطبيق إدارة متجر Jamal Phone - إدارة المنتجات والمخزون والمبيعات والمشتريات والحسابات والنسخ الاحتياطية.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: 2.4.1
  path: 1.9.0
  path_provider: 2.1.5
  provider: 6.1.5
  intl: 0.20.3
  fl_chart: 0.69.2
  mobile_scanner: 5.2.3
  shared_preferences: 2.5.3
  http: 1.5.0
  share_plus: 10.1.4
  file_picker: 8.3.7
  image_picker: 1.1.2
  uuid: 4.5.1
  connectivity_plus: 6.1.5
  flutter_animate: 4.5.0
  flutter_secure_storage: 10.3.4
  cryptography: 2.9.0
  workmanager: 0.10.10
  equatable: 2.0.7
  collection: 1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
